<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REGALO FLORES AMARILLAS EMILITA</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{
      font-family:Georgia,"Times New Roman",serif;
      background:radial-gradient(circle at 50% 75%,#473714 0,#171309 34%,#070706 68%,#020202 100%);
      color:#fff;
    }
    #stars{position:fixed;inset:0;pointer-events:none;overflow:hidden}
    .star{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffd94a;box-shadow:0 0 9px #ffd94a;animation:float linear infinite}
    @keyframes float{from{transform:translateY(105vh);opacity:0}15%{opacity:.9}to{transform:translateY(-15vh);opacity:0}}
    .screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;transition:opacity 1.2s ease,transform 1.2s ease}
    #intro{z-index:5;background:radial-gradient(circle,#33290f 0,#0a0905 48%,#020202 100%)}
    .intro-card{max-width:650px}
    .mini{letter-spacing:.22em;text-transform:uppercase;color:#e7c55a;font:600 12px Arial,sans-serif;margin-bottom:18px}
    h1{font-size:clamp(38px,8vw,76px);font-weight:400;margin:0 0 16px;color:#ffe16a;text-shadow:0 0 25px rgba(255,218,72,.35)}
    .intro-card p{font-size:clamp(17px,3vw,22px);line-height:1.6;color:#eee5c9;margin:0 auto 28px;max-width:520px}
    button{border:1px solid #e4c351;background:rgba(255,216,74,.08);color:#ffe477;padding:14px 28px;border-radius:999px;font-size:16px;cursor:pointer;box-shadow:0 0 24px rgba(255,216,74,.12);transition:.25s}
    button:hover{transform:translateY(-2px);background:rgba(255,216,74,.16)}
    #gift{opacity:0;pointer-events:none;z-index:3;flex-direction:column;justify-content:flex-start;padding-top:4vh}
    #gift.show{opacity:1;pointer-events:auto}
    .message{
      opacity:0;
      transform:translateY(-8px);
      transition:opacity 1s ease,transform 1s ease;
      max-width:760px;
      z-index:3;
      min-height:210px;
      background:rgba(0,0,0,.68);
      border:1px solid rgba(255,225,106,.22);
      border-radius:24px;
      padding:22px 30px 20px;
      box-shadow:0 12px 45px rgba(0,0,0,.55), inset 0 0 30px rgba(255,220,90,.035);
      backdrop-filter:blur(7px);
      -webkit-backdrop-filter:blur(7px);
    }
    .message.show{opacity:1;transform:translateY(0)}
    #line1{font-size:clamp(28px,5vw,48px);color:#ffe16a;margin-bottom:18px;text-shadow:0 0 18px rgba(255,221,83,.35)}
    #text{white-space:pre-line;font-size:clamp(17px,2.8vw,24px);line-height:1.6;color:#fff9df}
    .garden{
      position:absolute;
      left:0;
      right:0;
      bottom:-5vh;
      height:43vh;
      display:flex;
      justify-content:center;
      align-items:flex-end;
      gap:clamp(4px,2vw,22px);
      filter:drop-shadow(0 0 16px rgba(255,210,40,.15));
      z-index:1
    }
    .flower{position:relative;width:clamp(78px,14vw,150px);height:100%;transform-origin:bottom center;animation:sway 4s ease-in-out infinite alternate}
    .flower:nth-child(2){animation-delay:-1.3s}.flower:nth-child(3){animation-delay:-2.2s}.flower:nth-child(4){animation-delay:-.7s}.flower:nth-child(5){animation-delay:-1.8s}
    @keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
    .stem{
      position:absolute;
      width:7px;
      height:58%;
      background:linear-gradient(#4e9a37,#17461e);
      left:50%;
      bottom:0;
      transform:translateX(-50%);
      border-radius:10px
    }
    .leaf{
      position:absolute;
      width:42px;
      height:18px;
      background:#397c31;
      border-radius:100% 0 100% 0;
      bottom:24%;
      left:50%;
      transform:translateX(2px) rotate(-28deg)
    }
    .leaf.r{transform:translateX(-40px) rotate(205deg);bottom:34%}
    .bloom{
      position:absolute;
      left:50%;
      bottom:52%;
      width:78px;
      height:78px;
      transform:translateX(-50%) scale(0);
      transform-origin:50% 50%;
      opacity:0;
    }
    @keyframes bloom{
      0%{transform:translateX(-50%) scale(0);opacity:0}
      35%{opacity:1}
      75%{transform:translateX(-50%) scale(1.10);opacity:1}
      100%{transform:translateX(-50%) scale(1);opacity:1}
    }
    .flower.open .bloom{animation:bloom 1.5s cubic-bezier(.2,.8,.2,1) forwards}
    .petal{
      position:absolute;
      width:31px;
      height:48px;
      left:50%;
      bottom:50%;
      margin-left:-15.5px;
      background:radial-gradient(circle at 50% 70%,#ffe75d,#f2b913 72%);
      border-radius:55% 55% 45% 45%;
      transform-origin:50% 100%;
      box-shadow:0 0 10px rgba(255,214,52,.35);
    }
    .petal:nth-child(1){transform:rotate(0deg)}
    .petal:nth-child(2){transform:rotate(45deg)}
    .petal:nth-child(3){transform:rotate(90deg)}
    .petal:nth-child(4){transform:rotate(135deg)}
    .petal:nth-child(5){transform:rotate(180deg)}
    .petal:nth-child(6){transform:rotate(225deg)}
    .petal:nth-child(7){transform:rotate(270deg)}
    .petal:nth-child(8){transform:rotate(315deg)}
    .center{
      position:absolute;
      width:32px;
      height:32px;
      border-radius:50%;
      background:radial-gradient(circle at 40% 35%,#76501e,#3d2509 58%,#201204);
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      z-index:3;
      box-shadow:0 0 8px rgba(255,205,55,.22);
    }
    .signature{
      opacity:0;
      margin-top:14px;
      margin-left:auto;
      width:max-content;
      max-width:100%;
      color:#ffe16a;
      font-style:italic;
      font-size:clamp(15px,2vw,19px);
      line-height:1.35;
      text-align:right;
      text-shadow:0 0 14px rgba(255,221,83,.35);
      transition:opacity 1.4s ease;
    }
    .signature.show{opacity:1}
    .hide{opacity:0!important;transform:scale(1.04);pointer-events:none}
    @media(max-height:650px){#gift{padding-top:2vh}.message{min-height:150px;padding:16px 22px}.garden{height:42vh;bottom:-10vh}}
    @media(max-width:600px){.message{padding:20px 18px;border-radius:20px}.garden{height:43vh;bottom:-9vh}}
  </style>
</head>
<body>
<div id="stars"></div>

<section id="intro" class="screen">
  <div class="intro-card">
    <div class="mini">21 de septiembre · Flores amarillas</div>
    <h1>Para Emilita María 💛</h1>
    <p>Hay personas que hacen los días un poquito más bonitos con solo estar. Hoy quería recordarte que tú eres una de ellas.</p>
    <button id="open">Abrir mi regalo 🌻</button>
  </div>
</section>

<section id="gift" class="screen">
  <div class="message">
    <div id="line1"></div>
    <div id="text"></div>
    <div id="signature" class="signature">Con cariño,<br>Jhordy 💛</div>
  </div>
  <div class="garden" aria-hidden="true">
    <div class="flower"><div class="stem"></div><div class="leaf"></div><div class="leaf r"></div><div class="bloom"></div></div>
    <div class="flower"><div class="stem"></div><div class="leaf"></div><div class="leaf r"></div><div class="bloom"></div></div>
    <div class="flower"><div class="stem"></div><div class="leaf"></div><div class="leaf r"></div><div class="bloom"></div></div>
    <div class="flower"><div class="stem"></div><div class="leaf"></div><div class="leaf r"></div><div class="bloom"></div></div>
    <div class="flower"><div class="stem"></div><div class="leaf"></div><div class="leaf r"></div><div class="bloom"></div></div>
  </div>
</section>


<audio id="backgroundMusic" preload="auto" loop>
  <source src="audio.mp3" type="audio/mpeg">
</audio>

<script>
  document.querySelectorAll('.bloom').forEach(b=>{
    for(let i=0;i<8;i++){const p=document.createElement('div');p.className='petal';b.appendChild(p)}
    const c=document.createElement('div');c.className='center';b.appendChild(c)
  });
  const stars=document.getElementById('stars');
  for(let i=0;i<65;i++){
    const s=document.createElement('i');s.className='star';
    s.style.left=Math.random()*100+'vw';s.style.animationDuration=(5+Math.random()*8)+'s';
    s.style.animationDelay=(-Math.random()*10)+'s';s.style.opacity=.25+Math.random()*.7;stars.appendChild(s)
  }
  const title="Estas flores son para ti 🌻";
  const msg=`Tal vez sean flores virtuales,
pero llevan un mensaje muy real.

Eres una persona muy especial para mí,
me importas mucho y me alegra tenerte en mi vida.

Y por si algún día lo olvidas,
recuerda que tienes a alguien por aquí
que piensa en ti, que te quiere
y que siempre desea verte sonreír. ✨`;

  function type(el, str, speed, done){
    let i=0;
    (function next(){
      if(i<str.length){el.textContent+=str[i++];setTimeout(next,speed)}
      else if(done) done();
    })();
  }
  document.getElementById('open').addEventListener('click',()=>{
    const music=document.getElementById('backgroundMusic');
    music.volume=0.65;
    music.play().catch(()=>{});
    document.getElementById('intro').classList.add('hide');
    const gift=document.getElementById('gift');
    gift.classList.add('show');

    // Primero florece el ramo, una flor tras otra.
    const flowers=[...document.querySelectorAll('.flower')];
    flowers.forEach((flower,index)=>{
      setTimeout(()=>flower.classList.add('open'), 450 + index*420);
    });

    // Cuando el ramo terminó de florecer, aparece la tarjeta y empieza el mensaje.
    const bouquetTime = 450 + (flowers.length-1)*420 + 1700;
    setTimeout(()=>{
      document.querySelector('.message').classList.add('show');
      type(document.getElementById('line1'),title,55,()=>{
        setTimeout(()=>type(document.getElementById('text'),msg,28,()=>{
          // La firma aparece al final, en la esquina inferior derecha.
          document.getElementById('signature').classList.add('show');
        }),500);
      });
    }, bouquetTime);
  });
</script>
</body>
</html>
